
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفيق السفر</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --green:#075b43;
  --green2:#087653;
  --gold:#e6b84c;
  --cream:#f7f5ed;
  --white:#ffffff;
  --text:#263b32;
  --muted:#7b8981;
  --shadow:0 8px 20px rgba(0,0,0,.10);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:var(--cream);
  color:var(--text);
}

header{
  background:linear-gradient(135deg,#064b38,#087b58);
  color:white;
  padding:25px 18px 45px;
  text-align:center;
  position:relative;
  overflow:hidden;
  border-radius:0 0 35px 35px;
  box-shadow:0 8px 22px #063f302e;
}

header:before{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  border:1px solid #ffffff20;
  border-radius:50%;
  top:-130px;
  right:-60px;
}

header:after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border:1px solid #ffffff20;
  border-radius:50%;
  bottom:-140px;
  left:-45px;
}

.logo-icon{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:23px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  color:#fff;
  background:linear-gradient(145deg,#f3cf75,#b88727);
  box-shadow:0 7px 0 #805c1d,0 12px 20px #0004;
  transform:perspective(300px) rotateX(5deg);
}

header h1{
  margin:14px 0 3px;
  font-size:29px;
  font-weight:900;
}

header p{
  margin:0;
  color:#e6f2ec;
  font-size:14px;
}

.header-road{
  margin:24px auto 0;
  max-width:330px;
  height:48px;
  border-radius:50%;
  background:#ffffff12;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  color:#f5d27c;
  font-size:21px;
}

.container{
  width:min(950px,92%);
  margin:-20px auto 35px;
  position:relative;
}

.section-title{
  font-size:21px;
  font-weight:900;
  margin:30px 0 15px;
  color:var(--green);
  display:flex;
  align-items:center;
  gap:10px;
}

.section-title i{
  color:var(--gold);
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
  border:1px solid #eee9dc;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-weight:800;
  font-size:14px;
  color:#365448;
}

.input-wrap{
  position:relative;
}

.input-wrap i{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:#a98232;
  font-size:16px;
  pointer-events:none;
}

input,select,textarea{
  width:100%;
  border:1px solid #e3e5dc;
  border-radius:13px;
  padding:13px 42px 13px 12px;
  font-family:inherit;
  font-size:14px;
  outline:none;
  background:#fcfcf9;
  color:#30483d;
  transition:.2s;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--green2);
  box-shadow:0 0 0 3px #08765316;
}

select{
  appearance:auto;
}

.type-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.type-option{
  position:relative;
}

.type-option input{
  position:absolute;
  opacity:0;
}

.type-option label{
  min-height:105px;
  padding:15px 10px;
  border:2px solid #e9e9df;
  border-radius:17px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px;
  cursor:pointer;
  text-align:center;
  transition:.2s;
  background:#fff;
}

.type-option label i{
  font-size:26px;
  color:#b18a36;
}

.type-option input:checked+label{
  border-color:var(--green2);
  background:#eff8f3;
  box-shadow:0 5px 12px #08765318;
}

.main-btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  color:white;
  font-family:inherit;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(180deg,#15966c,#066044);
  box-shadow:0 6px 0 #03452f,0 10px 18px #064b3835;
  transition:.15s;
  margin-top:20px;
}

.main-btn:hover{
  filter:brightness(1.08);
  transform:translateY(-2px);
}

.main-btn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #03452f;
}

.trips-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

.trip-card{
  background:white;
  border:1px solid #e9e5d9;
  border-radius:18px;
  padding:17px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.trip-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:14px;
}

.trip-type{
  background:#eaf5ef;
  color:#08724f;
  border-radius:20px;
  padding:5px 10px;
  font-size:12px;
  font-weight:900;
}

.trip-date{
  color:#8a8e85;
  font-size:12px;
}

.route{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:#f8f8f2;
  padding:13px;
  border-radius:13px;
}

.route-place{
  font-weight:900;
  font-size:15px;
}

.route-arrow{
  color:#c29b43;
  font-size:18px;
}

.trip-details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.detail{
  color:#66776e;
  font-size:12px;
}

.detail i{
  color:#b58b35;
  margin-left:5px;
}

.trip-notes{
  margin-top:12px;
  padding:10px;
  background:#faf9f4;
  border-radius:10px;
  font-size:13px;
  color:#63736a;
  overflow-wrap:anywhere;
}

.trip-actions{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:14px;
}

.whatsapp-btn,.delete-btn{
  width:100%;
  border:0;
  border-radius:11px;
  padding:11px;
  color:white;
  font-family:inherit;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 4px 0 #0002;
  transition:.15s;
}

.whatsapp-btn{
  background:linear-gradient(180deg,#35ce79,#15934e);
  box-shadow:0 4px 0 #08743a;
  display:none;
}

.delete-btn{
  background:linear-gradient(180deg,#e66c61,#bd3d35);
  box-shadow:0 4px 0 #8e2923;
}

.whatsapp-btn:active,.delete-btn:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #0002;
}

.empty-state{
  text-align:center;
  padding:35px 15px;
  color:#849087;
  background:white;
  border-radius:18px;
  box-shadow:var(--shadow);
}

.empty-state i{
  display:block;
  font-size:40px;
  color:#d3b15b;
  margin-bottom:10px;
}

footer{
  text-align:center;
  padding:25px 15px;
  color:#7e8b82;
  font-size:12px;
}

@media(max-width:650px){
  .form-grid,.trips-grid{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:25px;
  }

  .card{
    padding:15px;
  }
}

@media(max-width:380px){
  .type-options{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo-icon">
    <i class="fa-solid fa-car-side"></i>
  </div>
  <h1>رفيق السفر</h1>
  <p>طريقك أسهل مع رفيق موثوق</p>

  <div class="header-road">
    <i class="fa-solid fa-location-dot"></i>
    <i class="fa-solid fa-road"></i>
    <i class="fa-solid fa-car-side"></i>
    <i class="fa-solid fa-location-dot"></i>
  </div>
</header>

<main class="container">

  <h2 class="section-title">
    <i class="fa-solid fa-circle-plus"></i>
    أضف إعلانك
  </h2>

  <section class="card">
    <form id="tripForm">

      <div class="field full">
        <label>نوع الإعلان</label>

        <div class="type-options">

          <div class="type-option">
            <input type="radio" name="type" id="driver" value="سائق لديه مقاعد" checked>
            <label for="driver">
              <i class="fa-solid fa-car"></i>
              <span>سائق لديه مقاعد</span>
            </label>
          </div>

          <div class="type-option">
            <input type="radio" name="type" id="passenger" value="مسافر يبحث عن مقعد">
            <label for="passenger">
              <i class="fa-solid fa-person-walking-luggage"></i>
              <span>مسافر يبحث عن مقعد</span>
            </label>
          </div>

        </div>
      </div>

      <div class="form-grid" style="margin-top:18px;">

        <div class="field">
          <label for="from">من</label>
          <div class="input-wrap">
            <i class="fa-solid fa-location-dot"></i>
            <input id="from" type="text" placeholder="مدينة الانطلاق" required>
          </div>
        </div>

        <div class="field">
          <label for="to">إلى</label>
          <div class="input-wrap">
            <i class="fa-solid fa-flag-checkered"></i>
            <input id="to" type="text" placeholder="مدينة الوصول" required>
          </div>
        </div>

        <div class="field">
          <label for="date">تاريخ السفر</label>
          <div class="input-wrap">
            <i class="fa-solid fa-calendar-days"></i>
            <input id="date" type="date" required>
          </div>
        </div>

        <div class="field">
          <label for="seats">عدد المقاعد</label>
          <div class="input-wrap">
            <i class="fa-solid fa-users"></i>
            <input id="seats" type="number" min="1" placeholder="عدد المقاعد" required>
          </div>
        </div>

        <div class="field">
          <label for="payment">نوع الرحلة</label>
          <div class="input-wrap">
            <i class="fa-solid fa-wallet"></i>
            <select id="payment" required>
              <option value="">اختر نوع الرحلة</option>
              <option value="مجاني">مجاني</option>
              <option value="مدفوع">مدفوع</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="price">السعر (جنيه)</label>
          <div class="input-wrap">
            <i class="fa-solid fa-money-bill-wave"></i>
            <input id="price" type="number" min="0" placeholder="السعر">
          </div>
        </div>

        <div class="field full">
          <label for="phone">رقم واتساب</label>
          <div class="input-wrap">
            <i class="fa-brands fa-whatsapp"></i>
            <input id="phone" type="tel" placeholder="مثال: 249912345678" required>
          </div>
        </div>

        <div class="field full">
          <label for="notes">ملاحظات إضافية</label>
          <div class="input-wrap">
            <i class="fa-solid fa-pen"></i>
            <textarea id="notes" placeholder="اكتب أي تفاصيل إضافية عن الرحلة"></textarea>
          </div>
        </div>

      </div>

      <button type="submit" class="main-btn" id="submitBtn">
        <i class="fa-solid fa-paper-plane"></i>
        نشر الإعلان
      </button>

    </form>
  </section>

  <h2 class="section-title">
    <i class="fa-solid fa-route"></i>
    الرحلات المتاحة
  </h2>

  <section id="tripsContainer" class="trips-grid">
    <div class="empty-state">
      <i class="fa-solid fa-spinner fa-spin"></i>
      جاري تحميل الرحلات...
    </div>
  </section>

</main>

<footer>
  رفيق السفر © جميع الحقوق محفوظة
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCsNI342kdzENIsD6_fJNJUaaPWIGQaFV8",
  authDomain: "transport-dd29b.firebaseapp.com",
  projectId: "transport-dd29b",
  storageBucket: "transport-dd29b.firebasestorage.app",
  messagingSenderId: "733040027721",
  appId: "1:733040027721:web:de67df74cbb04f59983798"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tripsCollection = collection(db, "trips");

const tripForm = document.getElementById("tripForm");
const tripsContainer = document.getElementById("tripsContainer");
const submitBtn = document.getElementById("submitBtn");


// تاريخ اليوم بالتوقيت المحلي

function getLocalDate(){
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth()+1).padStart(2,"0");
  const day = String(now.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;
}

document.getElementById("date").min = getLocalDate();


// حماية النصوص المعروضة من HTML

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char];
  });
}


// إخفاء جزء من رقم الهاتف

function maskPhone(phone){
  const value = String(phone || "");

  if(value.length < 7) return value;

  return value.slice(0,4) + "****" + value.slice(-3);
}


// إظهار السعر حسب نوع الرحلة

function getPriceText(trip){
  if(trip.payment === "مجاني"){
    return "مجاني";
  }

  return `${escapeHTML(trip.price || 0)} جنيه`;
}


// نشر إعلان جديد

tripForm.addEventListener("submit", async function(e){

  e.preventDefault();

  const type = document.querySelector('input[name="type"]:checked')?.value;

  const from = document.getElementById("from").value.trim();
  const to = document.getElementById("to").value.trim();
  const date = document.getElementById("date").value;
  const seats = Number(document.getElementById("seats").value);
  const payment = document.getElementById("payment").value;
  const price = document.getElementById("price").value;
  const phone = document.getElementById("phone").value.trim();
  const notes = document.getElementById("notes").value.trim();

  if(!type || !from || !to || !date || !seats || !payment || !phone){
    alert("يرجى ملء جميع الحقول المطلوبة");
    return;
  }

  if(date < getLocalDate()){
    alert("لا يمكن اختيار تاريخ سابق");
    return;
  }

  if(seats < 1){
    alert("عدد المقاعد يجب أن يكون واحداً على الأقل");
    return;
  }

  if(payment === "مدفوع" && (!price || Number(price) < 0)){
    alert("يرجى إدخال سعر صحيح");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري النشر...';

  try{

    await addDoc(tripsCollection, {
      type,
      from,
      to,
      date,
      seats,
      payment,
      price: payment === "مجاني" ? 0 : Number(price),
      phone,
      notes,
      createdAt: serverTimestamp()
    });

    alert("تم نشر إعلانك بنجاح");

    tripForm.reset();
    document.getElementById("date").min = getLocalDate();

  }catch(error){

    console.error("خطأ في نشر الإعلان:", error);
    alert("تعذر نشر الإعلان. تأكد من اتصال الإنترنت وقواعد Firebase.");

  }finally{

    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> نشر الإعلان';

  }

});


// عرض الرحلات مباشرة من Firebase

const tripsQuery = query(
  tripsCollection,
  orderBy("createdAt","desc")
);

onSnapshot(tripsQuery, function(snapshot){

  tripsContainer.innerHTML = "";

  const today = getLocalDate();

  const trips = [];

  snapshot.forEach(function(documentSnapshot){

    const trip = documentSnapshot.data();

    if(trip.date && trip.date >= today){
      trips.push({
        id: documentSnapshot.id,
        ...trip
      });
    }

  });

  if(trips.length === 0){

    tripsContainer.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <i class="fa-solid fa-car-side"></i>
        لا توجد رحلات متاحة حالياً
      </div>
    `;

    return;
  }

  trips.forEach(function(trip){

    const card = document.createElement("article");
    card.className = "trip-card";

    const safePhone = escapeHTML(trip.phone || "");
    const maskedPhone = escapeHTML(maskPhone(trip.phone || ""));

    card.innerHTML = `

      <div class="trip-top">
        <span class="trip-type">
          ${escapeHTML(trip.type)}
        </span>

        <span class="trip-date">
          <i class="fa-solid fa-calendar"></i>
          ${escapeHTML(trip.date)}
        </span>
      </div>

      <div class="route">

        <div class="route-place">
          ${escapeHTML(trip.from)}
        </div>

        <i class="fa-solid fa-arrow-left route-arrow"></i>

        <div class="route-place">
          ${escapeHTML(trip.to)}
        </div>

      </div>

      <div class="trip-details">

        <div class="detail">
          <i class="fa-solid fa-users"></i>
          ${escapeHTML(trip.seats)} مقعد
        </div>

        <div class="detail">
          <i class="fa-solid fa-money-bill-wave"></i>
          ${getPriceText(trip)}
        </div>

        <div class="detail">
          <i class="fa-solid fa-phone"></i>
          ${maskedPhone}
        </div>

        <div class="detail">
          <i class="fa-solid fa-tag"></i>
          ${escapeHTML(trip.payment)}
        </div>

      </div>

      ${
        trip.notes
        ? `<div class="trip-notes">${escapeHTML(trip.notes)}</div>`
        : ""
      }

      <div class="trip-actions">

        <button class="whatsapp-btn" type="button">
          <i class="fa-brands fa-whatsapp"></i>
          تواصل عبر واتساب
        </button>

        <button class="delete-btn" type="button">
          <i class="fa-solid fa-trash"></i>
          حذف الإعلان بعد إتمام السفر
        </button>

      </div>

    `;

    const whatsappBtn = card.querySelector(".whatsapp-btn");

    whatsappBtn.style.display = "block";

    whatsappBtn.addEventListener("click", function(){

      const cleanPhone = safePhone.replace(/[^0-9]/g,"");

      if(!cleanPhone){
        alert("رقم التواصل غير متاح");
        return;
      }

      const message = encodeURIComponent(
        `السلام عليكم، تواصلت معك بخصوص رحلة ${trip.from} إلى ${trip.to}`
      );

      window.open(
        `https://wa.me/${cleanPhone}?text=${message}`,
        "_blank"
      );

    });


    // حذف الإعلان

    const deleteBtn = card.querySelector(".delete-btn");

    deleteBtn.addEventListener("click", async function(){

      const confirmed = confirm(
        "هل أنت متأكد من حذف هذا الإعلان بعد إتمام السفر؟"
      );

      if(!confirmed) return;

      deleteBtn.disabled = true;
      deleteBtn.textContent = "جاري الحذف...";

      try{

        await deleteDoc(doc(db,"trips",trip.id));

        alert("تم حذف الإعلان");

      }catch(error){

        console.error("خطأ في الحذف:",error);

        alert("تعذر حذف الإعلان. راجع صلاحيات Firebase.");

        deleteBtn.disabled = false;
        deleteBtn.innerHTML =
          '<i class="fa-solid fa-trash"></i> حذف الإعلان بعد إتمام السفر';

      }

    });

    tripsContainer.appendChild(card);

  });

}, function(error){

  console.error("خطأ في تحميل الرحلات:",error);

  tripsContainer.innerHTML = `
    <div class="empty-state" style="grid-column:1/-1;">
      <i class="fa-solid fa-triangle-exclamation"></i>
      تعذر تحميل الرحلات. تأكد من إعدادات Firebase.
    </div>
  `;

});

</script>
</body>
</html>
